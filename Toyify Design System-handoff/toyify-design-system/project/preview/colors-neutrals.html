<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css">
<style>
  h3 { font: 600 12px var(--font-ui); color: var(--gray-500); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1; border-radius: 12px; display:flex; align-items:flex-end; padding:8px; border: 1px solid transparent; }
  .sw b { font: 600 10px var(--font-ui); }
  .sw.light b { color: var(--gray-800); }
  .sw.dark b { color: #fff; }
</style></head><body>
  <h3>Neutrals — Untitled UI grey scale</h3>
  <div class="row">
    <div class="sw light" style="background:var(--gray-25);border-color:var(--gray-200)"><b>25</b></div>
    <div class="sw light" style="background:var(--gray-50);border-color:var(--gray-200)"><b>50</b></div>
    <div class="sw light" style="background:var(--gray-100)"><b>100</b></div>
    <div class="sw light" style="background:var(--gray-200)"><b>200</b></div>
    <div class="sw light" style="background:var(--gray-300)"><b>300</b></div>
    <div class="sw light" style="background:var(--gray-400)"><b>400</b></div>
    <div class="sw dark" style="background:var(--gray-500)"><b>500</b></div>
    <div class="sw dark" style="background:var(--gray-600)"><b>600</b></div>
    <div class="sw dark" style="background:var(--gray-700)"><b>700</b></div>
    <div class="sw dark" style="background:var(--gray-900)"><b>900</b></div>
  </div>
  <div style="margin-top:14px;font:400 12px var(--font-body);color:var(--gray-500)">
    Body text is <span style="color:var(--gray-700);font-weight:600">gray-700 (#414651)</span>, muted is <span style="color:var(--gray-500);font-weight:600">gray-500 (#717680)</span>, borders are <span style="color:var(--gray-700);font-weight:600">gray-300 (#D5D7DA)</span>. Never use pure #000.
  </div>
</body></html>
