<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css">
<style>
  h3 { font: 600 12px var(--font-ui); color: var(--gray-500); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
  .row { padding: 12px 0; border-bottom: 1px dashed var(--gray-200); display:grid; grid-template-columns: 110px 1fr 160px; align-items:center; gap:16px; }
  .tag { font: 500 11px var(--font-mono); color: var(--gray-500); }
  .meta { text-align:right; font: 500 11px var(--font-mono); color: var(--gray-400); }
</style></head><body>
  <h3>Accent type — Caveat (handwritten), Permanent Marker (comic SFX)</h3>
  <div class="row"><div class="tag">handwritten</div><div class="t-handwritten" style="font-size:32px;color:var(--purple-700)">made with love ♡</div><div class="meta">Caveat · 700</div></div>
  <div class="row"><div class="tag">sketchy / SFX</div><div class="t-sketchy" style="font-size:40px;color:var(--pink-500)">POW!</div><div class="meta">Permanent Marker</div></div>
  <div class="row" style="border:none"><div class="tag">mono</div><div class="t-mono">order #TY-28401 · £39.00</div><div class="meta">JetBrains Mono</div></div>
</body></html>
