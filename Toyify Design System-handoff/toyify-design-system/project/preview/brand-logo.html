<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css">
<style>
  h3 { font: 600 12px var(--font-ui); color: var(--gray-500); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
  .stage { background: var(--purple-gradient); border-radius: 20px; padding: 22px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .logo { display: flex; align-items: center; justify-content: center; }
  .logo img { height: 36px; }
  .feat { background:#fff; border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow-md); display:flex; align-items:center; gap: 8px; font: 600 12px var(--font-body); color: var(--purple-900);}
  .feat .ic { width: 22px; height: 22px; background: var(--purple-100); color: var(--purple-700); border-radius: 999px; display:flex; align-items:center; justify-content:center;}
  .feat svg { width: 12px; height: 12px;}
  .r1 { transform: rotate(-6deg); }
  .r2 { transform: rotate(2deg); margin-top: 18px;}
  .r3 { transform: rotate(-3deg); }
</style></head><body>
  <h3>Brand — logo on gradient + tilted feature chips</h3>
  <div class="stage">
    <div class="logo"><img src="../assets/Logo.svg" alt="Toyify"></div>
    <div class="feat r1"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>Ready in 5-7 days</div>
    <div class="feat r2"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>Free shipping</div>
  </div>
</body></html>
